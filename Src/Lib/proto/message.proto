syntax = "proto3";

package SkillBridge.Message;

option csharp_namespace = "SkillBridge.Message";
option cc_enable_arenas = true;

////////////////////////////////////////////////////////////////
//
//  Basic Defines
//
////////////////////////////////////////////////////////////////
enum RESULT
{
	SUCCESS = 0;
	FAILED = 1;
}

enum CHARACTER_TYPE
{
	Player = 0;
	NPC = 1;
	Monster = 2;
}

enum CHARACTER_CLASS
{
	NONE = 0;
	WARRIOR = 1;
	WIZARD = 2;
	ARCHER = 3;
}

enum CHARACTER_STATE
{
	IDLE = 0;
	MOVE = 1;
}

enum ENTITY_EVENT
{
	NONE = 0;
	IDLE = 1;
	MOVE_FWD = 2;
	MOVE_BACK = 3;
	JUMP = 4;
}

enum ITEM_TYPE
{
  NORMAL = 0;
  MATERIAL = 1;
  EQUIP = 2;
  RIDE = 3;
}

enum EQUIP_SLOT
{
    WEAPON = 0 ;
    ACCESSORY = 1 ; 
    HELMET = 2 ;  //头盔
    CHEST = 3 ; //胸甲
    SHOULDER = 4 ;  //护肩
    PANTS = 5 ; //裤子
    BOOTS = 6 ; //靴子
    SLOT_MAX = 7 ; 
    
}

// 协议状态更新
enum STATUS_ACTION
{
  UPDATE = 0;
  ADD = 1;
  DELETE = 2;
}

enum STATUS_TYPE
{
  MONEY = 0;
  EXP = 1;
  SKILL_POINT = 2;
  ITEM = 3;
}

message NStatus
{
  STATUS_TYPE type = 1;
  STATUS_ACTION action = 2;
  int32 id = 3; // type 的 id
  int32 value = 4; // type 的 变化数量
}

message StatusNotify
{
  repeated NStatus status = 1;
}

message NUserInfo {
	int32 id = 1;
	NPlayerInfo player = 2;
}

message NPlayerInfo {
	int32 id = 1;
	repeated NCharacterInfo characters = 2;
}

message NCharacterInfo {
	int32 id = 1;  // dbID
  int32 config_id = 2; // configID
	int32 entity_id = 3; // entityID
	string name = 4;
	CHARACTER_TYPE type = 5;
	CHARACTER_CLASS class = 6;
	int32 level = 7;
	int32 mapId = 8;
	NEntity entity = 9;
  	int64  gold = 10;
  	repeated NItemInfo Items = 11; // 角色拥有的所有道具
  	NBagInfo bag = 12;
    bytes Equips = 13;
    repeated NQuestInfo quests = 14; // 任务列表
    repeated NFriendInfo friends = 15; // 好友列表
    NGuildInfo guild = 16; // 公会信息
}

message NItemInfo
{
  int32 id = 1;
  int32 count = 2;
}

message NBagInfo
{
  int32 unLocked = 1;
  bytes items = 2;
}

message NVector3
{
	int32 x = 1;
	int32 y = 2;
	int32 z = 3;
}

////////////////////////////////////////////////////////////////
//
//  Entities
//
////////////////////////////////////////////////////////////////


message NEntity {
	int32 id = 1;
	NVector3 position = 2;
	NVector3 direction = 3;
	int32 speed = 4;
}

message NEntitySync {
	int32 id = 1;
	ENTITY_EVENT event = 2;
	NEntity entity = 3;
	
}



////////////////////////////////////////////////////////////////
//
//  Messages
//
////////////////////////////////////////////////////////////////

message NetMessage{
	NetMessageRequest Request = 1;
	NetMessageResponse Response = 2;
}

message NetMessageRequest{
	UserRegisterRequest userRegister = 1;
	UserLoginRequest userLogin = 2;
	UserCreateCharacterRequest createChar = 3;
	UserGameEnterRequest gameEnter = 4;
	UserGameLeaveRequest gameLeave = 5;
	
	MapCharacterEnterRequest mapCharacterEnter = 6;

	MapEntitySyncRequest mapEntitySync = 8;
	MapTeleportRequest mapTeleport = 9;
  ItemBuyRequest itemBuy = 10;
  ItemEquipRequest itemEquip = 11;
  QuestListRequest questList = 12;
  QuestAcceptRequest questAccept = 13;
  QuestSubmitRequest questSubmit = 14;
  
  FriendAddRequest friendAddReq = 15;
  FriendAddResponse friendAddRep = 16;
  FriendListRequest friendList = 17;
  FriendRemoveRequest friendRemove = 18;


  TeamInviteRequest teamInviteReq = 19;
  TeamInviteResponse teamInviteRep = 20;
  TeamInfoRequest teamInfo = 21;
  TeamLeaveRequest teamLeave = 22;

  GuildCreateRequest guildCreate = 23;
  GuildJoinRequest guildJoinReq = 24;
  GuildJoinResponse guildJoinRep = 25;
  GuildListRequest guildList = 26;
  GuildRequest guild = 27;
  GuildLeaveRequest guildLeave = 28;
  GuildAdminRequest guildAdmin = 29;
  
}

message NetMessageResponse{
	UserRegisterResponse userRegister = 1;
	UserLoginResponse userLogin = 2;
	UserCreateCharacterResponse createChar = 3;
	UserGameEnterResponse gameEnter = 4;
	UserGameLeaveResponse gameLeave = 5;

	MapCharacterEnterResponse mapCharacterEnter = 6;
	MapCharacterLeaveResponse mapCharacterLeave = 7;

	MapEntitySyncResponse mapEntitySync = 8;

  	ItemBuyResponse itemBuy = 10;
    ItemEquipResponse itemEquip = 11;
    QuestListResponse questList = 12;
    QuestAcceptResponse questAccept = 13;
    QuestSubmitResponse questSubmit = 14;
    
    FriendAddRequest friendAddReq = 15;
    FriendAddResponse friendAddRep = 16;
    FriendListResponse friendList = 17;
    FriendRemoveResponse friendRemove = 18;

    TeamInviteRequest teamInviteReq = 19;
    TeamInviteResponse teamInviteRep = 20;
    TeamInfoResponse teamInfo = 21;
    TeamLeaveResponse teamLeave = 22;
    
    GuildCreateResponse guildCreate = 23;
    GuildJoinRequest guildJoinReq = 24;
    GuildJoinResponse guildJoinRep = 25;
    GuildListResponse guildList = 26;
    GuildResponse guild = 27;
    GuildLeaveResponse guildLeave = 28;
    GuildAdminResponse guildAdmin = 29;




  StatusNotify statusNotify = 100;
	
}


// User Protocol
message UserLoginRequest {
	string user = 1;
	string passward = 2;
}

message UserLoginResponse {
	RESULT result = 1;
	string errormsg = 2;
	NUserInfo userinfo = 3;
}


message UserRegisterRequest
{
	string user = 1;
	string passward = 2;
}

message UserRegisterResponse {
	RESULT result = 1;
	string errormsg = 2;
}

message UserCreateCharacterRequest
{
	string name = 1;
	CHARACTER_CLASS class = 2;
}

message UserCreateCharacterResponse {
	RESULT result = 1;
	string errormsg = 2;
	repeated NCharacterInfo characters = 3;
}

message UserGameEnterRequest
{
	int32 characterIdx = 1;
}

message UserGameEnterResponse {
	RESULT result = 1;
	string errormsg = 2;
  NCharacterInfo character = 3;
}

message UserGameLeaveRequest
{
}

message UserGameLeaveResponse {
	RESULT result = 1;
	string errormsg = 2;
}

message BagSaveRequest
{
  NBagInfo bagInfo = 1;
}

message BagSaveResponse
{
  RESULT result = 1;
  string errormsg = 2;
}

message ItemBuyRequest
{
  int32 shopId = 1;
  int32 shopItemId = 2;
}

message ItemBuyResponse
{
  RESULT result = 1;
  string errormsg = 2;
}

message ItemEquipRequest
{
  int32 slot = 1;
  int32 itemId = 2;
  bool isEquip = 3; // true: equip, false: unequip
}

message ItemEquipResponse
{
  RESULT result = 1;
  string errormsg = 2;
}


// Map Protocol
message MapCharacterEnterRequest
{
	int32 mapId = 1;
}

message MapCharacterEnterResponse
{
	int32 mapId = 1;
	repeated NCharacterInfo characters = 2;
}

message MapCharacterLeaveResponse
{
	int32 entityId = 1;
}


message MapEntitySyncRequest
{
    NEntitySync entitySync = 1;
}


message MapEntitySyncResponse
{
    repeated NEntitySync entitySyncs = 2;
}

message MapTeleportRequest
{
	int32 teleporterId = 1;
}

// Quest System
enum QUEST_STATUS
{
  IN_PROGRESS  = 0; // 已接受，未完成
  COMPLETED = 1; // 已完成，未提交
  FINISHED = 2; // 已完成，已提交
  FAILED = 3; // 已失败

}

enum QUEST_LIST_TYPE
{
  ALL = 0;
  IN_PROGRESS = 1;
  FINISHED = 2;
}


message NQuestInfo
{
  int32 quest_id = 1;
  int32 quest_guid = 2;  //  唯一标识，数据库中的id，用于区分重复任务的id
  QUEST_STATUS status = 3;
  repeated int32 target = 4;
}

message QuestListRequest
{
  QUEST_LIST_TYPE type = 1;

}

message QuestListResponse
{
  RESULT result = 1;
  string errormsg = 2;
  repeated NQuestInfo quests = 3;
}

message QuestAcceptRequest
{
  int32 quest_id = 1;
}

message QuestAcceptResponse
{
  RESULT result = 1;
  string errormsg = 2;
  NQuestInfo quest= 3;
}

message QuestSubmitRequest
{
  int32 quest_id = 1;
}

message QuestSubmitResponse
{
  RESULT result = 1;
  string errormsg = 2;
  NQuestInfo quest= 3; //更新任务信息到客户端
}


message QuestRejectRequest
{
  int32 quest_id = 1;
}

message QuestRejectResponse
{
  RESULT result = 1;
  string errormsg = 2;
}


// Friend System
message NFriendInfo
{
  int32  id = 1;
  NCharacterInfo friendInfo = 2;
  int32 status = 3;
  
}

message FriendAddRequest
{
  int32 from_id = 1;
  string from_name = 2;
  int32 to_id = 3;
  string to_name = 4;
}

message FriendAddResponse
{
  RESULT result = 1;
  string errormsg = 2;
  FriendAddRequest request = 3; // 需要记录请求信息
}

message FriendListRequest
{
  
}

message FriendListResponse
{
  RESULT result = 1;
  string errormsg = 2;
  repeated NFriendInfo friends = 3;
}

message FriendRemoveRequest
{
  int32 id = 1;
  int32 friendId = 2;
}

message FriendRemoveResponse
{
  RESULT result = 1;
  string errormsg = 2;
  int32 id = 3;
  
}



// Team System
message NTeamInfo
{
  int32 id = 1;
  int32 leaderId = 2;
  repeated NCharacterInfo members = 3;

}

message TeamInviteRequest
{
  int32 team_id = 1;
  int32 from_id = 2;
  string from_name = 3;
  int32 to_id = 4;
  string to_name = 5;
}

message TeamInviteResponse
{
  RESULT result = 1;
  string errormsg = 2;
  TeamInviteRequest request = 3; // 服务器需要转发请求
}

message TeamInfoRequest
{

}

message TeamInfoResponse
{
  RESULT result = 1;
  string errormsg = 2;
  NTeamInfo team = 3;
}

message TeamLeaveRequest
{
  int32 team_id = 1;
  int32 characterId = 2;
}

message TeamLeaveResponse
{
  RESULT result = 1;
  string errormsg = 2;
  int32 characterId = 3;

}



// Guild System

enum GUILD_TITLE
{
  NONE = 0;
  PRESIDENT = 1;
  VICE_PRESIDENT = 2;
}

enum GUILD_APPLY_RESULT
{
  NONE = 0;
  ACCEPT = 1;
  REJECT = 2;
}

message NGuildInfo
{
  int32 id =1;
  string name = 2;
  int32 leaderId = 3;
  string leaderName = 4;
  string introduce = 5;
  int32 memberCount = 6;
  repeated NGuildMemberInfo members = 7; // 公会成员列表
  repeated NGuildApplyInfo applies = 8; // 公会申请列表
  int64 createTime = 9;
  
}

message NGuildMemberInfo
{
  int32 id = 1;
  int32 characterId = 2;
  GUILD_TITLE title = 3;
  NCharacterInfo info = 4;
  int64 joinTime = 5; // 加入时间
  int64 lastTime = 6; // 最后一次上线时间
  int32 status = 7; // 在线状态
}

message NGuildApplyInfo
{
  int32 guild_id = 1;
  int32 characterId = 2;
  string name = 3;
  int32 class = 4;
  int32 level = 5;
  GUILD_APPLY_RESULT result = 6;
}

// 创建公会
message GuildCreateRequest
{
  string guildName = 1;
  string guildIntroduce = 2;
}

message GuildCreateResponse
{
  RESULT result = 1;
  string errormsg = 2;
  NGuildInfo guildInfo = 3; // 当角色登陆时没有公会信息，中间创建了需要服务器把整个公会信息返回给客户端
}

// 加入公会 member->server->leader
message GuildJoinRequest
{
  NGuildApplyInfo apply = 1;
}

message GuildJoinResponse
{
  RESULT result = 1;
  string errormsg = 2;
  NGuildApplyInfo apply = 3;
}

//公会列表
message GuildListRequest
{
  
}

message GuildListResponse
{
  RESULT result = 1;
  string errormsg = 2;
  repeated NGuildInfo guilds = 3;
}

// 后处理 ，请求更新单个公会信息
message GuildRequest
{
  
}

message GuildResponse
{
  RESULT result = 1;
  string errormsg = 2;
  NGuildInfo guildInfo = 3;
}

message GuildLeaveRequest
{
  
}

message GuildLeaveResponse
{
  RESULT result = 1;
  string errormsg = 2;
}


// 公会管理

enum GUILD_ADMAIN_COMMAND
{
  KICKOUT = 1; // 踢人
  PROMOTE = 2; // 晋升
  DEPOSE = 3; // 罢免
  TREANSFER = 4; // 转让
  SET_INTRODUCE = 5; // 修改公会宗旨
}

message GuildAdminRequest
{
  GUILD_ADMAIN_COMMAND command = 1;
  int32 targetId = 2;
  string introduce = 3; // 修改公会宗旨时使用
}

message GuildAdminResponse
{
  RESULT result = 1;
  string errormsg = 2;
  GUILD_ADMAIN_COMMAND command = 3;
}